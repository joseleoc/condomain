@if (activeCondominium(); as condominium) {
  <ion-button (click)="isIncomeModalOpen.set(true)">
    <ion-icon slot="start" name="add-circle-outline"></ion-icon>
    {{ 'shared.incomeForm.title' | transloco }}
  </ion-button>

  <app-income-form-modal
    [isOpen]="isIncomeModalOpen()"
    [condominiumId]="condominium.id"
    [baseCurrency]="condominium.currency"
    (isOpenChange)="isIncomeModalOpen.set($event)"
    (formSubmit)="onIncomeFormSubmit($event)"
  />
} @else {
  <app-new-condo-animated-btn />
}
