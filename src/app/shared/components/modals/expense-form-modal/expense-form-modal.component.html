<ion-modal
  [isOpen]="isOpen()"
  [backdropDismiss]="false"
  (didDismiss)="cancel()"
>
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>
          {{ 'financial.transactions.form.expenseTitle' | transloco }}
        </ion-title>
        <ion-buttons slot="end">
          <ion-button fill="clear" color="secondary" (click)="cancel()">
            {{ 'financial.transactions.form.cancel' | transloco }}
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding" [scrollY]="true">
      <app-expense-form
        [condominiumId]="condominiumId()"
        [baseCurrency]="baseCurrency()"
        (formSubmit)="onFormSubmit($event)"
        (cancelled)="cancel()"
      ></app-expense-form>
    </ion-content>

    <ion-footer>
      <ion-toolbar>
        <ion-buttons slot="end">
          <ion-button fill="solid" color="primary" (click)="submit()">
            {{ 'financial.transactions.form.save' | transloco }}
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-footer>
  </ng-template>
</ion-modal>
